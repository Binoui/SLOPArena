<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Slop Factory</title>
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#ffcc22">
<meta name="apple-mobile-web-app-title" content="Slop Factory">
<style>
@font-face{font-family:"Archivo Black";src:url(/font.ttf) format("truetype");font-display:block}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f0eee8;color:#1b1a18;font:15px/1.35 system-ui,sans-serif;padding:18px 22px 40px;max-width:1280px;margin:auto}
h1,.chip,.btn,.tab,h3,h4{font-family:"Archivo Black","Arial Black",Impact,sans-serif;text-transform:uppercase;letter-spacing:-.01em}
h1{font-size:28px;background:#ffcc22;display:inline-block;padding:6px 14px 4px;box-shadow:6px 6px 0 #161513;transform:rotate(-1.5deg);margin:4px 0 16px}
h4{font-size:14px;margin:12px 0 6px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.btn{border:3px solid #1b1a18;background:#fff;color:#1b1a18;padding:7px 12px 5px;font-size:13px;cursor:pointer;box-shadow:3px 3px 0 #161513;text-decoration:none;display:inline-block}
.bar[hidden]{display:none}
.btn.go{background:#ffcc22}.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #161513}.btn.small{padding:3px 8px 2px;font-size:11px;box-shadow:2px 2px 0 #161513}
.run{flex:1;min-width:260px;font-size:13px;border:3px solid #1b1a18;padding:6px 10px;background:#fff}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#3a3;margin-right:5px}.dot.busy{background:#f05b35}
#msg{font-weight:700;min-height:22px;margin-bottom:6px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{border:3px solid #1b1a18;padding:6px 10px 4px;font-size:13px;white-space:nowrap;cursor:pointer;background:#fff}
.tab .online{background:#2e9a47;color:#1b1a18;padding:0 6px;margin-left:6px;font-style:normal}
.tab.on{background:#1b1a18;color:#ffcc22}.tab b{background:#f05b35;color:#fff;padding:0 6px;margin-left:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}
.card{background:#fff;border:3px solid #1b1a18;box-shadow:5px 5px 0 #161513;cursor:pointer;display:flex;flex-direction:column;position:relative}
.card.sel{outline:4px solid #f05b35}
.card img,.card .noimg{width:100%;aspect-ratio:9/16;object-fit:cover;display:block;border-bottom:3px solid #1b1a18;background:#2a2826}
.card .noimg{display:flex;align-items:center;justify-content:center;color:#f0eee8;font-weight:700;padding:10px;text-align:center}
.card .t{padding:7px 8px 4px;font-weight:800;font-size:14px}
.card .busy{position:absolute;top:8px;left:8px;background:#f05b35;color:#fff;font-weight:800;font-size:11px;padding:2px 6px}
.chip{font-size:10px;padding:2px 6px 1px;background:#1b1a18;color:#ffcc22;margin:0 8px 8px;align-self:flex-start}
.chip.explainer{background:#f05b35;color:#fff}
.empty{padding:30px;text-align:center;border:3px dashed #1b1a18;font-weight:700}
.sheet{background:#fff;border:4px solid #1b1a18;box-shadow:8px 8px 0 #161513;padding:16px;display:none;grid-template-columns:300px 1fr;gap:18px;margin-bottom:18px}
.sheet.on{display:grid}
.sheet video{width:300px;aspect-ratio:9/16;background:#1b1a18;border:3px solid #1b1a18}
.sheet h3{font-size:22px;margin-bottom:6px}.sheet p{margin-bottom:8px}
.takes{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.takes .btn.on{background:#1b1a18;color:#ffcc22}
.notes{margin-bottom:8px}.notes div{background:#f0eee8;border-left:5px solid #f05b35;padding:5px 8px;font-size:13px;margin-bottom:4px;white-space:pre-wrap}
.notes div.agent{border-left-color:#1b1a18}.notes small{opacity:.6;font-weight:700}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.shots{display:flex;gap:8px;margin:6px 0 10px;flex-wrap:wrap}.shots div{width:84px;font-size:11px;cursor:pointer}
.shots img{width:84px;aspect-ratio:9/16;object-fit:cover;border:2px solid #1b1a18;display:block}
textarea{width:100%;border:3px solid #1b1a18;padding:6px;font:inherit;min-height:60px}
.plats{display:flex;gap:4px;flex-wrap:wrap;padding:0 8px 8px}
.plat{font:800 10px/1 system-ui,sans-serif;border:2px solid #1b1a18;padding:3px 5px 2px;text-transform:uppercase;color:#8a867d;border-style:dashed}
.plat.on{background:#2f9e44;color:#fff;border-style:solid}
.where{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:6px 8px;align-items:center;margin:4px 0 8px}
.where input[type=text]{width:100%;border:2px solid #1b1a18;padding:4px 6px;font:13px system-ui,sans-serif}
.where a{font-size:12px;font-weight:700;color:#1b1a18}
.kit{border:3px solid #1b1a18;padding:8px 10px;margin-bottom:6px;background:#f0eee8}
.kit b{font-family:"Archivo Black","Arial Black",sans-serif;text-transform:uppercase;font-size:12px;font-weight:400}
.kit pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.35 system-ui,sans-serif;margin:4px 0}
.kit .btn{margin-right:6px}
a.sheetlink{font-size:12px;font-weight:700;color:#1b1a18}
table.list{width:100%;border-collapse:collapse;background:#fff;border:3px solid #1b1a18}
table.list td,table.list th{border:1px solid #1b1a18;padding:6px;font-size:13px;text-align:left;vertical-align:top}
table.list a{color:#1b1a18;font-weight:700}
table.list input{width:80px;border:2px solid #1b1a18;padding:2px 4px}
.state{font-weight:800}.state.failed{color:#c22}.state.done{color:#272}.state.running,.state.sent,.state.queued{color:#d84}
.report{background:#fff;border:3px solid #1b1a18;padding:10px 14px;margin-bottom:10px;font-size:15px;line-height:1.45;max-width:760px}
.report summary{cursor:pointer;font-weight:800}.report p,.report ul,.report ol{margin:0 0 8px}.report ul,.report ol{padding-left:20px}
.report li{margin-bottom:4px}.report h3{font-size:18px;margin:10px 0 6px}.report h4{font-size:14px;margin:14px 0 6px}
.report code{background:#f0eee8;padding:0 3px}.report a{color:#1b1a18;word-break:break-all}
.inbox div{background:#fff;border:2px solid #1b1a18;padding:6px 8px;margin-bottom:6px;font-size:13px;word-break:break-word}
.inbox div.used{opacity:.5}
.tabrun{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.tabrun span{font-size:13px}
.check-card{align-self:start}
.check-card img,.check-card .noimg{aspect-ratio:16/9}
.check-card .t{font-size:16px}.check-id{color:#8a8578;font-weight:800}.check-card .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:4px 8px 8px}
.check-card .chip{margin:0}.chip.qa-pass{background:#2f9e44;color:#fff}.chip.qa-partial{background:#ffcc22;color:#1b1a18}.chip.qa-fail{background:#b22;color:#fff}
.notes div.qa{border-left-color:#2f9e44}.age{font-size:12px;color:#625f58}
.thread{display:flex;align-items:center;gap:6px;background:#f0eee8;border:2px solid #1b1a18;padding:4px 6px;font-size:12px;min-width:0;max-width:100%;margin:0 0 8px}
.thread span{overflow-wrap:anywhere;flex:1;min-width:0}.thread .btn{flex-shrink:0}
.check-sheet{grid-template-rows:auto 1fr;row-gap:0}.check-sheet>div{min-width:0}
.check-intro,.check-feedback{grid-column:2}.check-intro{grid-row:1}.check-feedback{grid-row:2}
.check-media{grid-column:1;grid-row:1 / span 2;display:flex;flex-direction:column;gap:10px}
.check-media img,.check-media video{width:100%;height:auto;aspect-ratio:auto;max-height:480px;object-fit:contain;border:3px solid #1b1a18;background:#1b1a18}
.checksteps{border:0;padding:0;margin:12px 0}.checksteps code{overflow-wrap:anywhere}
.check-filter{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.check-filter select{border:3px solid #1b1a18;background:#fff;padding:5px;font:inherit;max-width:100%}
.send-note{display:flex;gap:8px;align-items:center;font-size:13px;margin-top:6px}.send-note input{width:18px;height:18px}
.notes .delivery{display:block;opacity:1}.notes .delivery.error{color:#b22}
@media(max-width:700px){body{padding:12px}.sheet{grid-template-columns:1fr}.sheet video{width:100%;max-width:340px}
  .check-intro,.check-media,.check-feedback{grid-column:1;grid-row:auto}.check-media{margin:8px 0}.grid{grid-template-columns:repeat(2,1fr);gap:12px}h1{font-size:21px}}
@media(max-width:700px){.grid.player-reports{grid-template-columns:1fr}}
.player-reports .card img{width:100%;height:auto;aspect-ratio:16/9;object-fit:contain;display:block;background:#1b1a18}
.report-open{display:block;width:100%;padding:0;border:0;background:transparent;text-align:left;font:inherit;color:inherit;cursor:pointer}
.report-copy{padding:14px;overflow-wrap:anywhere;min-width:0}.report-copy p{white-space:pre-wrap}.player-evidence{white-space:pre-wrap;overflow-wrap:anywhere;max-width:100%}
.report-image{width:100%;height:auto}.report-copy .btn,.report-open{min-height:44px}.report-copy label{display:block;margin:12px 0}
.report-copy input,.report-copy textarea{box-sizing:border-box;width:100%;padding:10px;font:inherit;border:2px solid #1b1a18}
</style>
</head>
<body>
<h1>Slop Factory</h1>
<div class="tabs" id="areas">
  <button class="tab" id="clips-area" onclick="pickArea('clips')">Clips</button>
  <button class="tab" id="checks-area" onclick="pickArea('checks')">Checks</button>
  <button class="tab" id="player-reports-area" onclick="pickArea('player-reports')">Player reports</button>
  <a class="tab" id="console-area" href="/console/" style="color:inherit;text-decoration:none">Console<span id="console-online" class="online" hidden></span></a>
</div>
<div class="bar">
  <div class="run" id="running">Loading...</div>
</div>
<div id="msg"></div>
<div class="tabs" id="tabs"></div>
<div class="sheet" id="sheet"></div>
<div id="view"></div>
<script>
const TABS = [["review","To review",["rendered"]],["proposed","Proposed",["proposed"]],["approved","Approved",["approved"]],
  ["ready","Ready to post",["ready"]],["posted","Posted",["posted"]],["rejected","Rejected",["rejected"]],
  ["numbers","Numbers",[]],["scout","Scout",[]],["runs","Runs",[]]];
const ACTIONS = {rendered:[["ready","Ready to post","go"],["approved","Redo with note",""],["rejected","Reject",""]],
  proposed:[["approved","Approve","go"],["rejected","Reject",""]], approved:[["ready","Ready to post","go"],["proposed","Back to proposed",""],["rejected","Reject",""]],
  ready:[["posted","Mark posted","go"],["approved","Redo with note",""],["rejected","Reject",""]], posted:[], rejected:[["proposed","Restore",""]]};
const CHECK_TABS = [["to-try","To try"],["redo","Redo"],["good","Good"],["dropped","Dropped"]];
// The fourth field picks how a Good reaches a linked thread: "commit" asks it to commit and settle, "quiet" sends nothing.
const CHECK_GOOD = [["good","Good + commit","go","commit"],["good","Good only","","quiet"]];
const CHECK_ACTIONS = {"to-try": [...CHECK_GOOD,["redo","Redo with note",""],["dropped","Drop",""]],
  redo: [...CHECK_GOOD,["dropped","Drop",""]], good: [["to-try","Reopen",""]], dropped: [["to-try","Reopen",""]]};
const checkActions = d => d.thread ? CHECK_ACTIONS[d.status]
  : CHECK_ACTIONS[d.status].filter(a => a[3] !== "commit").map(a => a[3] ? ["good","Good","go"] : a);
const TAB_RUNS = {proposed: ["propose", "Propose clips", "The designer builds the batch around your open notes in the Scout inbox, then the latest scout reports and what changed in the game: 5 to 7 ideas here."],
  approved: ["render", "Render approved", "Films every idea in this tab; each take lands in To review."]};
const ACTIVE = ["queued","sent","running"], PLATFORMS = ["tiktok","shorts","instagram","threads","x"];
const PLATFORM_NAMES = {tiktok: "TikTok", shorts: "YouTube Shorts", instagram: "Instagram", threads: "Threads", x: "X"};
// Upload pages Post everywhere opens; X and Threads get their caption typed in (Threads falls back to the X text).
const UPLOAD = {tiktok: () => "https://www.tiktok.com/tiktokstudio/upload", shorts: () => "https://www.youtube.com/upload",
  instagram: () => "https://www.instagram.com/", threads: c => "https://www.threads.com/intent/post?text=" + encodeURIComponent((c.threads || c.x || {}).text || ""),
  x: c => "https://x.com/intent/post?text=" + encodeURIComponent((c.x || {}).text || "")};
// Where a ready or posted video is up: its posts field, platform -> link (or true when posted without one).
const shelf = d => ["ready","posted"].includes(d.status) && !d.usedIn;
const plats = d => shelf(d) ? `<div class="plats">${PLATFORMS.map(p => `<span class="plat ${(d.posts || {})[p] ? "on" : ""}">${(d.posts || {})[p] ? "✓ " : ""}${PLATFORM_NAMES[p]}</span>`).join("")}</div>` : "";
const RUN_TEXT = {propose: "Sent to T3: the designer thread appears in about 2 minutes, ideas land in PROPOSED.", render: "Sent to T3: the thread appears in about 2 minutes, clips land in TO REVIEW.",
  scout: "Sent to T3: the scout thread appears in about 2 minutes, its report lands in this tab.", redo: "Sent to T3: the redo thread appears in about 2 minutes, the new take lands in TO REVIEW."};
let B = {ideas: [], checks: [], runs: [], inbox: [], reports: []}, tab = localStorage.tab || "review", open = null, shown = {};
let area = ["checks", "player-reports"].includes(localStorage.area) ? localStorage.area : "clips", checkTab = localStorage.checkTab || "to-try", checkArea = "";
if (!TABS.some(t => t[0] === tab)) tab = "review";
if (!CHECK_TABS.some(t => t[0] === checkTab)) checkTab = "to-try";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);
const byId = id => B.ideas.find(d => d.id === id);
const top_ = () => B.ideas.filter(d => d.format !== "shot");
const say = m => document.getElementById("msg").textContent = m ? "▸ " + m : "";
const last = d => d.takes[d.takes.length - 1];
const pickTake = d => d.takes.find(t => t.n === shown[d.id]) || d.takes.find(t => t.n === d.chosen) || last(d);
const busy = id => B.runs.find(r => r.idea === id && ACTIVE.includes(r.state));
const runName = r => `${r.kind}${r.idea ? " " + (byId(r.idea)?.title || r.idea) : ""}`;

async function loadConsoleBadge() {
  const badge = document.getElementById('console-online');
  try {
    const response = await fetch('/console/api/observation', {signal: AbortSignal.timeout(6000)});
    if (!response.ok) throw new Error('Console observation unavailable');
    const snapshot = await response.json();
    const count = snapshot.players.filter(player => player.masterConnected).length;
    badge.textContent = count ? `${count} on` : '';
    badge.hidden = !count;
  } catch { badge.hidden = true; }
}
async function load() {
  void loadConsoleBadge();
  B = await (await fetch("/api/board")).json();
  const active = B.runs.filter(r => ACTIVE.includes(r.state));
  document.getElementById("running").innerHTML = `<span class="dot ${active.length ? "busy" : ""}"></span><b>Running:</b> ` +
    (active.length ? active.map(r => `#${r.id} ${esc(runName(r))} (${r.state === "sent" ? "waiting for T3, about 2 min" : r.state})`).join(", ") : "nothing");
  draw();
  if (open && area !== "player-reports") area === "checks" ? showCheck(open, false) : show(open, false);
}
function count(k, s) {
  if (k === "scout") return B.inbox.filter(i => !i.report).length;
  if (k === "runs") return B.runs.filter(r => r.state === "failed").length;
  return k === "numbers" ? 0 : top_().filter(d => s.includes(d.status)).length;
}
function draw() {
  for (const name of ["clips", "checks", "player-reports"]) document.getElementById(name + "-area").classList.toggle("on", area === name);
  const waiting = B.checks.filter(c => c.status === "to-try" || c.status === "redo").length;
  document.getElementById("checks-area").innerHTML = "Checks" + (waiting ? `<b>${waiting}</b>` : "");
  document.getElementById("running").parentElement.hidden = area !== "clips";
  document.getElementById("player-reports-area").innerHTML = "Player reports" + (B.playerReportCounts?.new ? `<b>${B.playerReportCounts.new}</b>` : "");
  if (area === "player-reports") return void drawPlayerReports();
  if (area === "checks") return drawChecks();
  document.getElementById("tabs").innerHTML = TABS.map(([k, l, s]) => {
    const n = count(k, s);
    return `<div class="tab ${k === tab ? "on" : ""}" onclick="pick('${k}')">${l}${n ? `<b>${n}</b>` : ""}</div>`;
  }).join("");
  const [, , s] = TABS.find(t => t[0] === tab);
  const list = top_().filter(d => s.includes(d.status)).reverse();
  const tr = TAB_RUNS[tab], head = tr ? `<div class="tabrun"><button class="btn go" onclick="startRun('${tr[0]}')">${tr[1]}</button><span>${tr[2]}</span></div>` : "";
  document.getElementById("view").innerHTML = head + (tab === "numbers" ? numbers() : tab === "scout" ? scout() : tab === "runs" ? runs()
    : list.length ? `<div class="grid">${list.map(card).join("")}</div>` : `<div class="empty">Nothing here.</div>`);
}
function card(d) {
  const shots = (d.beats || []).filter(b => b.type === "shot").length, t = pickTake(d), r = busy(d.id);
  const img = t?.poster ? `<img src="${t.poster}" alt="" loading="lazy">` : `<div class="noimg">${d.status === "proposed" ? "Idea, not filmed yet" : "No clip yet"}</div>`;
  return `<div class="card ${open === d.id ? "sel" : ""}" onclick="show('${d.id}')">${r ? `<span class="busy">RUN #${r.id} ${r.state.toUpperCase()}</span>` : ""}${img}
    <div class="t">${esc(d.title || d.id)}</div>
    <span class="chip ${esc(d.format)}">${esc(d.format)}${shots ? ` &middot; ${shots} shots` : ""}${d.takes.length > 1 ? ` &middot; ${d.takes.length} takes` : ""}</span>${plats(d)}${d.usedIn ? `<span class="chip">inside ${esc(byId(d.usedIn)?.title || d.usedIn)}</span>` : ""}</div>`;
}
function draftPosts() {
  const posts = {};
  PLATFORMS.forEach(p => { const link = document.getElementById("wl-" + p).value.trim();
    if (document.getElementById("w-" + p).checked) posts[p] = link || true; });
  return posts;
}
function where(d, draft) {
  const posts = draft || d.posts || {};
  const left = PLATFORMS.filter(p => !posts[p]);
  return `<h4>Posted on</h4>${d.status === "ready" && left.length ? `<p><button class="btn go" onclick="postEverywhere('${d.id}')">Post everywhere</button>
    <span class="age">Opens ${left.map(p => PLATFORM_NAMES[p]).join(", ")}${desk() ? ", and the clip in a drag window on the desk" : ""}.</span></p>` : ""}<div class="where">${PLATFORMS.map(p => { const v = posts[p];
    return `<input type="checkbox" id="w-${p}" ${v ? "checked" : ""}><label for="w-${p}">${PLATFORM_NAMES[p]}</label>
      <span><input type="text" id="wl-${p}" placeholder="Link (optional)" value="${esc(typeof v === "string" ? v : "")}"
        oninput="if(this.value.trim())document.getElementById('w-${p}').checked=true"></span>`; }).join("")}</div>
    <button class="btn small go" onclick="savePosts('${d.id}')">Save where it's posted</button>
    ${PLATFORMS.filter(p => typeof posts[p] === "string").map(p => `<a href="${esc(posts[p])}" target="_blank" rel="noopener">${PLATFORM_NAMES[p]} ↗</a>`).join(" &middot; ")}`;
}
// On a desk (mouse), the sloparena-post: link opens `factory.py drag`: a small window to drag the file into each tab.
const desk = () => matchMedia("(pointer: fine)").matches;
function postEverywhere(id) {
  const d = byId(id), posts = d.posts || {}, left = PLATFORMS.filter(p => !posts[p]);
  if (desk()) location.href = "sloparena-post:" + id;  // first: it needs the click, the pop-ups use the site permission
  const blocked = left.filter(p => !window.open(UPLOAD[p](d.captions || {}), "_blank")).length;
  say(blocked ? `${blocked} tab(s) blocked: allow pop-ups for this site (address bar icon), then press again`
    : desk() ? "Drag the clip from the SLOPArena post window into each tab" : "Pages opened");
}
// Caption kit: captions field, platform -> {title?, text}, written by the agent that delivered the video.
function kit(d) {
  const c = d.captions || {};
  const parts = PLATFORMS.filter(p => c[p]).map(p => `<div class="kit"><b>${PLATFORM_NAMES[p]}</b>
    ${c[p].title ? `<pre>${esc(c[p].title)}</pre><button class="btn small" onclick="copyText(byId('${d.id}').captions.${p}.title)">Copy title</button>` : ""}
    <pre>${esc(c[p].text || "")}</pre><button class="btn small" onclick="copyText(byId('${d.id}').captions.${p}.text)">Copy ${c[p].title ? "description" : "caption"}</button>
    ${c[p].reply ? `<pre>Reply: ${esc(c[p].reply)}</pre><button class="btn small" onclick="copyText(byId('${d.id}').captions.${p}.reply)">Copy reply</button>` : ""}</div>`);
  return `<h4>Captions</h4>${parts.join("") || `<p class="age">No captions yet. Ask for them in a note.</p>`}`;
}
async function copyText(text) {
  try {
    if (navigator.clipboard) await navigator.clipboard.writeText(text);
    else {
      const input = document.createElement("textarea"); input.value = text;
      input.style.position = "fixed"; input.style.opacity = "0"; document.body.append(input); input.select();
      if (!document.execCommand("copy")) throw new Error("Clipboard unavailable");
      input.remove();
    }
    say("Copied");
  } catch { say("Copy failed: select the text by hand"); }
}
async function savePosts(id) {
  const d = byId(id), posts = draftPosts();
  try {
    await send("PATCH", `/api/ideas/${id}`, {posts});
    if (d.status === "ready" && Object.keys(posts).length) await send("POST", `/api/ideas/${id}/verdict`, {status: "posted", note: ""});
    say(`${d.title}: posted on ${Object.keys(posts).map(p => PLATFORM_NAMES[p]).join(", ") || "nothing"}`);
    await load();
  } catch (e) { say("Failed: " + e.message); }
}

}
function scout() {
  const open_ = B.inbox.filter(i => !i.report), used = B.inbox.filter(i => i.report);
  return `<p style="margin-bottom:8px">Drop links (TikToks, Shorts, posts) or thoughts here. Run scout to get a report on links. A request for a clip or a theme ("a clip of the defensive options") goes to the next Propose clips, which builds its batch around it; no scout run needed.</p>
    <textarea id="inboxText" placeholder="https://www.tiktok.com/@.../video/... why it caught your eye"></textarea>
    <div class="acts"><button class="btn" onclick="addInbox()">Add to inbox</button><button class="btn go" onclick="startRun('scout')">Run scout</button></div>
    <h4>Inbox (${open_.length} new)</h4><div class="inbox">${open_.concat(used).map(i => `<div class="${i.report ? "used" : ""}">${esc(i.body)}${i.report ? ` <small>(report ${i.report})</small>` : ""}</div>`).join("") || "Empty."}</div>
    <h4>Reports</h4>${B.reports.map((r, i) => `<details class="report" id="report-${r.id}" ${i ? "" : "open"}><summary>${esc(r.kind)} report ${r.id}, ${esc(r.at.slice(0, 10))}</summary>${md(r.body)}</details>`).join("") || "None yet."}`;
}
function md(text) {  // the subset agents write in reports: headings, paragraphs, lists, bold, code, bare links
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/https?:\/\/[^\s<)]*[^\s<).,;:!?]/g, u => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
  let out = "", para = [], list = "";
  const flush = () => { if (para.length) out += `<p>${inline(para.join(" "))}</p>`; para = []; };
  const close = () => { flush(); if (list) out += `</li></${list}>`; list = ""; };
  for (const line of String(text).split("\n")) {
    const h = line.match(/^(#{1,3})\s+(.*)/), li = line.match(/^([-*]|\d+\.)\s+(.*)/);
    if (h) { close(); out += `<h${h[1].length + 2}>${inline(h[2])}</h${h[1].length + 2}>`; }
    else if (li) { const kind = /\d/.test(li[1]) ? "ol" : "ul";
      if (list === kind) out += `</li><li>${inline(li[2])}`; else { close(); out += `<${kind}><li>${inline(li[2])}`; list = kind; } }
    else if (list && /^\s+\S/.test(line)) out += " " + inline(line.trim());
    else if (!line.trim()) close();
    else { if (list) close(); para.push(line.trim()); }
  }
  close(); return out;
}
async function addInbox() {
  const text = document.getElementById("inboxText").value;
  try { await send("POST", "/api/inbox", {body: text}); say("Added to the scout inbox"); await load(); } catch (e) { say("Failed: " + e.message); }
}
function runs() {
  if (!B.runs.length) return `<div class="empty">No runs yet. The buttons above and Redo start them; each one is a T3 thread.</div>`;
  return `<table class="list"><tr><th>#</th><th>Run</th><th>State</th><th>Result</th><th>Output</th><th>Started</th><th></th></tr>` + B.runs.map(r =>
    `<tr><td>${r.id}</td><td>${esc(runName(r))}</td><td class="state ${r.state}">${r.state}</td><td>${esc(r.summary || r.error || "")}</td><td>${outputs(r).map(o => o.report
      ? `<a href="#" onclick="openReport(${o.report});return false">report ${o.report}</a>`
      : `<a href="#" onclick="openIdea('${o.id}');return false">${esc(o.title || o.id)}</a>`).join("<br>")}</td>
     <td>${esc(r.created.replace("T", " ").slice(5, 16))}</td><td>${["queued", "failed"].includes(r.state) ? `<button class="btn small" onclick="resend(${r.id})">Resend</button>` : ""}</td></tr>`).join("") + `</table>`;
}
function outputs(r) {  // a shot links to the explainer it was made for
  const made = JSON.parse(r.made || "[]"), reports = made.filter(m => m.startsWith("report:")).map(m => ({report: +m.slice(7)}));
  const ideas = new Set(made.filter(m => !m.startsWith("report:")).map(id => byId(id)?.for || id));
  return reports.concat([...ideas].map(byId).filter(Boolean));
}
function openIdea(id) { const d = byId(id); if (!d) return; area = localStorage.area = "clips"; tab = localStorage.tab = (TABS.find(t => t[2].includes(d.status)) || TABS[0])[0]; show(id); }
function openReport(n) {
  pick("scout"); const el = document.getElementById(`report-${n}`);
  if (el) { el.open = true; el.scrollIntoView({behavior: "smooth", block: "start"}); }
}
load().then(() => {
  const hash = decodeURIComponent(location.hash.slice(1)), check = hash.match(/^check-(\d+)$/);
  if (hash === 'clips' || hash === 'checks') {
    pickArea(hash);
  } else if (check && checkById(+check[1])) {
    area = localStorage.area = "checks"; checkTab = localStorage.checkTab = checkById(+check[1]).status; showCheck(+check[1]);
  } else openIdea(hash);
}).catch(e => say("Could not load: " + e.message));
setInterval(() => { const typing = ["note", "inboxText", "checkNote", "sendNote", "checkFilter", "reportTitle", "reportSteps", "reportArea"].includes(document.activeElement?.id) || /^(wl?|s|um)-/.test(document.activeElement?.id || ""); const playing = [...document.querySelectorAll("video")].some(v => !v.paused);
  if (!typing && !playing) load(); }, 15000);
</script>
