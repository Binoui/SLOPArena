<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SLOPArena content factory</title>
<style>
@font-face{font-family:"Archivo Black";src:url(/font.ttf) format("truetype");font-display:block}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f0eee8;color:#1b1a18;font:15px/1.35 system-ui,sans-serif;padding:18px 22px 40px;max-width:1280px;margin:auto}
h1,.chip,.btn,.tab,h3{font-family:"Archivo Black","Arial Black",Impact,sans-serif;text-transform:uppercase;letter-spacing:-.01em}
h1{font-size:28px;background:#ffcc22;display:inline-block;padding:6px 14px 4px;box-shadow:6px 6px 0 #161513;transform:rotate(-1.5deg);margin:4px 0 16px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.btn{border:3px solid #1b1a18;background:#fff;color:#1b1a18;padding:7px 12px 5px;font-size:13px;cursor:pointer;box-shadow:3px 3px 0 #161513}
.btn.go{background:#ffcc22}.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #161513}.btn:disabled{opacity:.4}
.run{flex:1;min-width:260px;font-size:13px;border:3px solid #1b1a18;padding:6px 10px;background:#fff}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#3a3;margin-right:5px}.dot.busy{background:#f05b35}
#msg{font-weight:700;min-height:22px;margin-bottom:6px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{border:3px solid #1b1a18;padding:6px 10px 4px;font-size:13px;white-space:nowrap;cursor:pointer;background:#fff}
.tab.on{background:#1b1a18;color:#ffcc22}.tab b{background:#f05b35;color:#fff;padding:0 6px;margin-left:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}
.card{background:#fff;border:3px solid #1b1a18;box-shadow:5px 5px 0 #161513;cursor:pointer;display:flex;flex-direction:column}
.card.sel{outline:4px solid #f05b35}
.card img,.card .noimg{width:100%;aspect-ratio:9/16;object-fit:cover;display:block;border-bottom:3px solid #1b1a18;background:#2a2826}
.card .noimg{display:flex;align-items:center;justify-content:center;color:#f0eee8;font-weight:700;padding:10px;text-align:center}
.card .t{padding:7px 8px 4px;font-weight:800;font-size:14px}
.chip{font-size:10px;padding:2px 6px 1px;background:#1b1a18;color:#ffcc22;margin:0 8px 8px;align-self:flex-start}
.chip.explainer{background:#f05b35;color:#fff}
.empty{padding:30px;text-align:center;border:3px dashed #1b1a18;font-weight:700}
.sheet{background:#fff;border:4px solid #1b1a18;box-shadow:8px 8px 0 #161513;padding:16px;display:none;grid-template-columns:300px 1fr;gap:18px;margin-bottom:18px}
.sheet.on{display:grid}
.sheet video{width:300px;aspect-ratio:9/16;background:#1b1a18;border:3px solid #1b1a18}
.sheet h3{font-size:22px;margin-bottom:6px}.sheet p{margin-bottom:8px}
.fb{background:#f0eee8;border-left:5px solid #f05b35;padding:6px 8px;font-size:13px;margin-bottom:8px;white-space:pre-wrap}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.shots{display:flex;gap:8px;margin:6px 0 10px;flex-wrap:wrap}.shots div{width:84px;font-size:11px;cursor:pointer}
.shots img{width:84px;aspect-ratio:9/16;object-fit:cover;border:2px solid #1b1a18;display:block}
textarea{width:100%;border:3px solid #1b1a18;padding:6px;font:inherit;min-height:60px}
.path{font:11px monospace;opacity:.6;word-break:break-all}
.nums{width:100%;border-collapse:collapse;background:#fff;border:3px solid #1b1a18}
.nums td,.nums th{border:1px solid #1b1a18;padding:6px;font-size:13px;text-align:left}.nums input{width:80px;border:2px solid #1b1a18;padding:2px 4px}
@media(max-width:700px){.sheet{grid-template-columns:1fr}.sheet video{width:100%;max-width:300px}}
</style>
</head>
<body>
<h1>SLOPArena content factory</h1>
<div class="bar">
  <button class="btn go" onclick="run('propose')">Propose clips</button>
  <button class="btn" onclick="run('render')">Render approved</button>
  <div class="run" id="running">Loading...</div>
</div>
<div id="msg"></div>
<div class="tabs" id="tabs"></div>
<div class="sheet" id="sheet"></div>
<div id="view"></div>
<script>
const TABS = [["review","To review",["rendered"]],["proposed","Proposed",["proposed"]],["approved","Rendering",["approved"]],
  ["ready","Ready to post",["ready"]],["posted","Posted",["posted"]],["rejected","Rejected",["rejected"]],["numbers","Numbers",[]]];
const ACTIONS = {rendered:[["ready","Ready to post","go"],["approved","Redo with note",""],["rejected","Reject",""]],
  proposed:[["approved","Approve","go"],["rejected","Reject",""]], approved:[["proposed","Back to proposed",""]],
  ready:[["posted","Mark posted","go"],["approved","Redo with note",""]], posted:[], rejected:[["proposed","Restore",""]]};
const PLATFORMS = ["tiktok","shorts","x"];
let items = [], tab = localStorage.tab || "review", open = null;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);
const byId = id => items.find(d => d.id === id);
const top_ = () => items.filter(d => d.format !== "shot");
const say = m => document.getElementById("msg").textContent = m ? "▸ " + m : "";

async function load() {
  const data = await (await fetch("/api/queue")).json();
  items = data.items;
  const r = data.running, busy = r.work.length || r.editor === "held";
  document.getElementById("running").innerHTML = `<span class="dot ${busy ? "busy" : ""}"></span><b>Running:</b> ` +
    (r.work.length ? esc(r.work.join(", ")) : "no clip renders") + ` &middot; Editor ${esc(r.editor)}`;
  draw();
}
function draw() {
  document.getElementById("tabs").innerHTML = TABS.map(([k, l, s]) => {
    const n = k === "numbers" ? 0 : top_().filter(d => s.includes(d.status)).length;
    return `<div class="tab ${k === tab ? "on" : ""}" onclick="pick('${k}')">${l}${n ? `<b>${n}</b>` : ""}</div>`;
  }).join("");
  const [, , s] = TABS.find(t => t[0] === tab);
  const list = top_().filter(d => s.includes(d.status));
  document.getElementById("view").innerHTML = tab === "numbers" ? numbers() : list.length
    ? `<div class="grid">${list.map(card).join("")}</div>` : `<div class="empty">Nothing here.</div>`;
}
function card(d) {
  const shots = (d.beats || []).filter(b => b.type === "shot").length;
  const img = d.thumb ? `<img src="${d.thumb}" alt="" loading="lazy">` : `<div class="noimg">${d.status === "proposed" ? "Idea, not filmed yet" : "No clip yet"}</div>`;
  return `<div class="card ${open === d.id ? "sel" : ""}" onclick="show('${d.id}')">${img}<div class="t">${esc(d.title || d.id)}</div>
    <span class="chip ${esc(d.format)}">${esc(d.format)}${shots ? ` &middot; ${shots} shots` : ""}</span></div>`;
}
function pick(k) { tab = localStorage.tab = k; hide(); draw(); }
function hide() { open = null; history.replaceState(null, "", location.pathname); document.getElementById("sheet").classList.remove("on"); }
function show(id) {
  const d = byId(id); if (!d) return; open = id; history.replaceState(null, "", "#" + id);
  const shots = (d.beats || []).filter(b => b.type === "shot").map(b => byId(b.clip)).filter(Boolean);
  const unused = items.filter(x => x.for === d.id && !shots.includes(x));
  const sheet = document.getElementById("sheet");
  sheet.innerHTML = `${d.video ? `<video src="${d.video}" poster="${d.thumb}" controls playsinline preload="metadata"></video>` : `<div class="empty">No clip yet</div>`}
    <div><h3>${esc(d.title || d.id)}</h3>
    <span class="chip ${esc(d.format)}" style="margin:0 0 8px;display:inline-block">${esc(d.format)} &middot; ${esc(d.status)}</span>
    <p>${esc(d.idea)}</p>
    ${shots.concat(unused).length ? `<div class="shots">${shots.concat(unused).map(s => `<div onclick="show('${s.id}')">
      ${s.thumb ? `<img src="${s.thumb}" alt="">` : ""}${esc(s.title)}${unused.includes(s) ? " (unused)" : ""}</div>`).join("")}</div>` : ""}
    ${d.for ? `<p><a href="#" onclick="show('${esc(d.for)}');return false">← part of ${esc(d.for)}</a></p>` : ""}
    ${d.feedback ? `<div class="fb">${esc(d.feedback)}</div>` : ""}
    <textarea id="note" placeholder="Note for the agent: what to change, a caption idea, why it's rejected..."></textarea>
    <div class="acts">${(ACTIONS[d.status] || []).map(([s, l, c]) => `<button class="btn ${c}" onclick="act('${d.id}','${s}')">${l}</button>`).join("")}
      <button class="btn" onclick="act('${d.id}','')">Save note</button><button class="btn" onclick="hide();draw()">Close</button></div>
    <p class="path">${esc(d.clip || "")}</p></div>`;
  sheet.classList.add("on"); draw(); sheet.scrollIntoView({behavior: "smooth", block: "nearest"});
}
async function post(url, body) {
  const res = await (await fetch(url, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)})).json();
  if (res.error) throw new Error(res.error);
  return res;
}
async function act(id, status) {
  const note = document.getElementById("note")?.value || "";
  try { await post("/api/update", {id, status, note}); say(`${byId(id).title || id}: ${status || "note saved"}`); hide(); await load(); }
  catch (e) { say("Failed: " + e.message); }
}
async function run(action) {
  try { await post("/api/run", {action}); say(action === "propose" ? "Designer started in T3: new ideas land in PROPOSED." : "Renderer started in T3: clips land in TO REVIEW."); }
  catch (e) { say("Could not start: " + e.message); }
}
function numbers() {
  const posted = top_().filter(d => d.status === "posted");
  if (!posted.length) return `<div class="empty">Nothing posted yet. Mark a clip in READY TO POST as posted, then fill in its views here.</div>`;
  return `<table class="nums"><tr><th>Clip</th><th>Posted</th>${PLATFORMS.map(p => `<th>${p} views</th>`).join("")}<th>Steam visits</th><th></th></tr>` +
    posted.map(d => `<tr><td>${esc(d.title)}</td><td>${esc(d.posted || "")}</td>${PLATFORMS.concat(["steam"]).map(p =>
      `<td><input id="s-${d.id}-${p}" value="${esc((d.stats || {})[p] ?? "")}"></td>`).join("")}
      <td><button class="btn" onclick="stats('${d.id}')">Save</button></td></tr>`).join("") + `</table>`;
}
async function stats(id) {
  const s = {}; PLATFORMS.concat(["steam"]).forEach(p => { const v = document.getElementById(`s-${id}-${p}`).value.trim(); if (v) s[p] = v; });
  try { await post("/api/update", {id, status: "", note: "", stats: s}); say("Numbers saved"); await load(); } catch (e) { say("Failed: " + e.message); }
}
load().then(() => { const id = decodeURIComponent(location.hash.slice(1)); const d = byId(id);
  if (d) { tab = (TABS.find(t => t[2].includes(d.status)) || TABS[0])[0]; show(id); } });
setInterval(() => { if (!open) load(); }, 15000);
</script>
</body>
</html>
