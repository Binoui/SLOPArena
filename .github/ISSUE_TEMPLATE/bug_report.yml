---
name: Bug Report
description: Report something that's broken or not working as expected
title: "[Bug] "
labels: ["bug"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Include the game build or source revision and enough detail to reproduce the problem.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this bug?
      placeholder: |
        1. Open the game
        2. Press X
        3. Move to location Y
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      description: Where did the problem occur?
      options:
        - Training or Solo
        - Online match (PvP)
        - Ability Lab or authoring tools
        - Frontend or settings
        - Shared or server tools/tests
        - Several modes
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Game build or source revision
      description: Steam Playtest build/version or Git commit; say unknown if unavailable.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system
      description: Include the version and whether you used the packaged game or Unity Editor.
    validations:
      required: true
  - type: input
    id: unity_version
    attributes:
      label: Unity Editor version
      description: For Editor/authoring problems; the project uses 6000.0.78f1. Leave blank for packaged-game reports.
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs / Screenshots
      description: Attach relevant Player.log, Unity Console, server/test output, or screenshots. Remove tokens, credentials, and other private data.
      render: shell
  - type: checkboxes
    id: terms
    attributes:
      label: Contribution
      options:
        - label: I am willing to submit a PR to fix this issue
