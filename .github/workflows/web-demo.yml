name: web demo
on:
  push:
    branches: [main]
    paths:
      - client/Web/**
      - src/Shared/**
      - content-cooked/**
      - data/arenas/**
      - client/Unity/Assets/CharacterPackages/**
      - .github/workflows/web-demo.yml
  pull_request:
    paths:
      - client/Web/**
      - .github/workflows/web-demo.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: web-demo-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Fetch the pinned assets
        run: client/Web/scripts/assets.sh fetch
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Re-export Unity effects
        run: |
          pip install pyyaml pillow
          node client/Web/scripts/vfx-reference.mjs --write
          node client/Web/scripts/export-vfx.mjs > /dev/null
      - name: Check fighter models against Unity
        run: python3 client/Web/scripts/asset-sources.py check --github
      - name: Build the WASM sim
        run: client/Web/scripts/build.sh
      - name: Smoke-test a headless match
        run: node client/Web/scripts/smoke.mjs brawl after_hours fightguy,manki
      - name: Smoke-test the tutorial
        run: node client/Web/scripts/smoke.mjs tutorial license_test fightguy,bonk
      - name: Package
        run: node client/Web/scripts/package.mjs
      - name: Deploy to Cloudflare Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.156.0'
          command: pages deploy client/Web/dist --project-name=sloparena-play --branch=main --commit-hash=${{ github.sha }}
