name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check project documentation
        run: |
          python3 -m unittest discover -s tools -p 'test_*.py'
          python3 tools/check_docs.py
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build src/Shared/ --nologo
      - run: dotnet test tests/Shared.Tests/ --nologo
      - run: dotnet build src/Server/ --nologo
      - run: dotnet test tests/Server.Tests/ --nologo
  agent-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test agent tooling without a live Editor
        run: node --test --test-concurrency=1 scripts/unity-editor-gateway.test.ts tools/skill-evals/src/import.test.ts
