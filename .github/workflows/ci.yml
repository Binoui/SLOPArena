name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check project documentation
        run: |
          python3 -m pip install --quiet pillow
          python3 -m unittest discover -s tools -p 'test_*.py'
          python3 tools/check_docs.py
      - name: Test release preparation, resuming and receiver boundaries
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 -m unittest discover -s deploy/vps -p 'test_*.py'
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Build maintained .NET projects and tools
        run: dotnet build SlopArena.sln --nologo -p:SkipUnityPluginCopy=true
      - name: Test Shared and Server
        run: dotnet test SlopArena.sln --no-build --nologo -p:SkipUnityPluginCopy=true
  agent-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test agent tooling without a live Editor
        run: node --test --test-concurrency=1 scripts/unity-editor-gateway.test.ts tools/skill-evals/src/import.test.ts
